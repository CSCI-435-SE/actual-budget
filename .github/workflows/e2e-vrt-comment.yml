name: VRT Comment
# This workflow posts VRT failure comments on PRs, including fork PRs.
# It runs with elevated permissions via workflow_run trigger.
on:
  # workflow_run is needed to get a token that can comment on fork PRs.
  # This job only downloads a metadata artifact and posts a comment;
  # it never checks out or executes PR-supplied code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['E2E Tests']
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post VRT Comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download VRT metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: vrt-comment-metadata
          path: /tmp/vrt-metadata
        continue-on-error: true

      - name: Extract metadata
        id: metadata
        run: |
          if [ ! -f "/tmp/vrt-metadata/pr-number.txt" ]; then
            echo "No metadata found, skipping..."
            echo "should_comment=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(cat "/tmp/vrt-metadata/pr-number.txt")
          VRT_RESULT=$(cat "/tmp/vrt-metadata/vrt-result.txt")
          ARTIFACT_URL=$(cat "/tmp/vrt-metadata/artifact-url.txt")

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "vrt_result=$VRT_RESULT" >> "$GITHUB_OUTPUT"
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

          if [ "$VRT_RESULT" = "failure" ]; then
            echo "should_comment=true" >> "$GITHUB_OUTPUT"
            echo "VRT tests failed for PR #$PR_NUMBER"
          else
            echo "should_comment=false" >> "$GITHUB_OUTPUT"
            echo "VRT tests passed or skipped for PR #$PR_NUMBER"
          fi

      # Fork-only (issue #153): upstream's `/update-vrt` bot can't run here, so
      # the comment walks people through the "Update VRT screenshots"
      # workflow (update-vrt.yml) and lists the test files that failed.
      - name: Download VRT JUnit reports
        if: steps.metadata.outputs.should_comment == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: vrt-junit-*
          path: /tmp/vrt-junit
        continue-on-error: true

      # Only master's helper script runs here, never the PR's code
      - name: Check out the helper script from master
        if: steps.metadata.outputs.should_comment == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Write the comment
        if: steps.metadata.outputs.should_comment == 'true'
        env:
          ARTIFACT_URL: ${{ steps.metadata.outputs.artifact_url }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-vrt.yml
        run: |
          failed_files=""
          if [ -d /tmp/vrt-junit ]; then
            failed_files=$(node .github/scripts/vrt-failed-files.mjs /tmp/vrt-junit || true)
          fi

          if [ -n "$failed_files" ]; then
            files_step=$(printf '%s\n' \
              "3. For **Test files**, paste the files that failed, so only they are run:" \
              "   \`\`\`" \
              "   $failed_files" \
              "   \`\`\`" \
              "   Or leave it blank to update every screenshot (slower).")
          else
            files_step="3. Leave **Test files** blank to update every screenshot."
          fi

          cat > /tmp/vrt-comment.md <<EOF
          <!-- vrt-comment -->
          VRT tests ❌ failed. [View the test report]($ARTIFACT_URL).

          **If the screenshot changes are expected** (you changed the UI on purpose), update the screenshots with the **Update VRT screenshots** workflow:

          1. Open [Actions → Update VRT screenshots]($WORKFLOW_URL) and click **Run workflow**.
          2. Leave **Use workflow from** on \`master\` and enter \`$PR_NUMBER\` as the **PR number**.
          $files_step
          4. Click **Run workflow**. When it finishes, it has committed the new screenshots to this PR's branch and started the E2E tests on that commit. The run's summary links to both.
          5. Run \`git pull\` before you push again, so you have the bot's commit.

          Before merging, look at the new screenshots in the bot's commit and check that they show what you expect.

          **If the changes aren't expected**, the test report shows what's different. Fix the UI instead of updating the screenshots.
          EOF

      - name: Comment on PR with VRT report link
        if: steps.metadata.outputs.should_comment == 'true'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          number: ${{ steps.metadata.outputs.pr_number }}
          header: vrt-comment
          hide_and_recreate: true
          hide_classify: OUTDATED
          path: /tmp/vrt-comment.md
