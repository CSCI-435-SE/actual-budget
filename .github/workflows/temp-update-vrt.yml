name: TEMP - Generate tags VRT snapshots
# TEMPORARY: generates the new e2e/tags.test.ts snapshots in the same
# Playwright container as the `vrt` job in e2e-test.yml and commits the PNGs
# back to this branch. Remove this file once the snapshots are committed.

on:
  push:
    branches:
      - test/issue-157-tags-e2e-vrt

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VRT_FILES: e2e/tags.test.ts

jobs:
  build-web:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Build browser bundle
        env:
          REACT_APP_NETLIFY: 'true'
        run: yarn build:browser --skip-translations
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-client-build
          path: packages/desktop-client/build/
          retention-days: 1
          overwrite: true

  update-vrt:
    name: Generate tags VRT snapshots
    runs-on: ubuntu-latest
    needs: build-web
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      E2E_USE_BUILD: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Trust the repository directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-client-build
          path: packages/desktop-client/build/
      # `missing` writes new snapshots but still fails the test, so use
      # `changed`; it is scoped to tags.test.ts, which has no other snapshots
      - name: Generate snapshots
        run: yarn vrt --update-snapshots=changed $VRT_FILES
      - name: Verify generated snapshots
        run: yarn vrt $VRT_FILES
      - name: Upload snapshots artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-snapshots
          path: packages/desktop-client/e2e/tags.test.ts-snapshots/
          retention-days: 7
      - name: Commit and push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'packages/desktop-client/e2e/tags.test.ts-snapshots/*.png'
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git diff --staged --stat
          git commit -m "[AI] Add tags VRT screenshots" -m "Auto-generated by temp-update-vrt workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
